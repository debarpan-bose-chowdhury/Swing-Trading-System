[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-trading-hpo"
version = "0.1.0"
description = "Robust hyper-parameter search for the Swing-Trading-System (personal use)"
requires-python = ">=3.12"
dependencies = ["swing-trading-backtest", "optuna==5.0.*", "cmaes", "numpy", "pandas>=3.0", "pyarrow>=20", "scipy", "plotly", "pyyaml"]

[project.optional-dependencies]
gp = ["torch"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
swing-trading-backtest = { path = "../backtest", editable = true }

[tool.pytest.ini_options]
testpaths = ["../tests/hpo"]
pythonpath = [".."]
filterwarnings = ["ignore::optuna.exceptions.ExperimentalWarning"]

[tool.setuptools]
packages = []
