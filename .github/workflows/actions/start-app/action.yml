name: Start app
description: Generate a local TLS cert, start the app via DOCKER Compose, and wait for /health

inputs:
    image-ref:
        required: true
    compose-file:
        required: true
    compose-service:
        default: app
    health-url:
        default: https://localhost:8080/health
    max-retries:
        default: "30"
    delay:
        default: "10"

runs:
    using: composite
    steps:
        - name: Create local TLS certificate
          shell: bash
          run: |
            set -euo pipefail
            mkdir -p certs
            openssl req -x509 -nodes -days 1 -newkey rsa:2048 -keyout certs/key.pem -out certs/cert.pem -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
            sudo chown 10001:10001 certs/key.pem certs/cert.pem
            chmod 600 certs/key.pem
            chmod 644 certs/cert.pem
        
        - name: Start stack
          shell: bash
          env:
            IMAGE_REF: ${{ inputs.image-ref }}
            COMPOSE_FILE: ${{ inputs.compose-file }}
            COMPOSE_SERVICE: ${{ inputs.compose-service }}
          run: |
            set -euo pipefail
            docker pull "$IMAGE_REF"
            docker compose -f "$COMPOSE_FILE" down || true
            docker compose -f "$COMPOSE_FILE" up -d "$COMPOSE_SERVICE"

        - name: Wait for health check
          shell: bash
          env:
            COMPOSE_FILE: ${{ inputs.compose-file }}
            HEALTH_URL: ${{ inputs.health-url }}
          run: |
            set -euo pipefail
            for i in $(seq 1 ${{ inputs.max-retries }}); do
              echo "[${i}]/${{ inputs.max-retries }}: Checking health at $HEALTH_URL"
              if curl -sf --cacert certs/cert.pem "$HEALTH_URL" >/dev/null; then
                echo "Health check passed."
                exit 0
              fi
              echo "Health check failed. Retrying in ${{ inputs.delay }} seconds..."
              sleep ${{ inputs.delay }}
            done
            docker compose -f "$COMPOSE_FILE" logs
            exit 1
