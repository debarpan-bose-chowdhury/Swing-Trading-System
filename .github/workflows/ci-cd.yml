name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python -m pip install --upgrade pip==25.2
          python -m pip install --only-binary :all: --no-deps .
      - shell: bash
        run: python -m unittest discover -s tests -v

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: python
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938

  build-docker:
    needs: [ci, codeql]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          image_name='swing-trading-system'
          image_ref="ghcr.io/${{ github.repository_owner }}/$image_name:${{ github.sha }}"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
          echo "image-name=$image_name" >> "$GITHUB_OUTPUT"
          echo "Generated image_ref: $image_ref"
          echo "Generated image-name: $image_name"
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image-name }}:latest
          provenance: true
          sbom: true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image-name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ steps.meta.outputs.image-name }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
  debug-image:
      needs: build-docker
      if: always()
      runs-on: ubuntu-latest
      steps:
        - name: Debug build output
          run: |
            echo "build-docker result: ${{ needs.build-docker.result }}"
            echo "image_ref: '${{ needs.build-docker.outputs.image_ref }}'"
            echo "digest: ${{ needs.build-docker.outputs.image-digest }}"
  deploy-staging:
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      packages: read
      contents: read
    env:
      IMAGE_REF: ${{ needs['build-docker'].outputs.image_ref }}
      COMPOSE_FILE: docker-compose.staging.yml
      COMPOSE_SERVICE: app
      HEALTH_CHECK_URL: https://localhost:8080/health
      HEALTH_CHECK_MAX_RETRIES: "30"
      HEALTH_CHECK_DELAY: "10"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Login to GHCR
        if: ${{ startsWith(env.IMAGE_REF, 'ghcr.io/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Create local TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certs
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout certs/key.pem \
            -out certs/cert.pem \
            -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Pull latest image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
      - name: Deploy via Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_REF
          docker compose -f "$COMPOSE_FILE" down || true
          docker compose -f "$COMPOSE_FILE" up -d "$COMPOSE_SERVICE"
      - name: Wait for health check
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 "$HEALTH_CHECK_MAX_RETRIES"); do
            echo "[${i}/${HEALTH_CHECK_MAX_RETRIES}] Checking health: ${HEALTH_CHECK_URL}"
            if curl -ksf "$HEALTH_CHECK_URL" >/dev/null 2>&1; then
              echo "✓ Health check passed"
              exit 0
            fi
            if [ "$i" -lt "$HEALTH_CHECK_MAX_RETRIES" ]; then
              echo "  Waiting ${HEALTH_CHECK_DELAY}s before retry..."
              sleep "$HEALTH_CHECK_DELAY"
            fi
          done

          echo "✗ Health check failed after $HEALTH_CHECK_MAX_RETRIES attempts" >&2
          docker compose -f "$COMPOSE_FILE" logs
          exit 1

  dast-scan:
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      security-events: write
      contents: read
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/dast-smoke.yml@da8f68e4f868c85ea540e36a60004d800176c778
    with:
      target-url: https://localhost:8080
      smoke-endpoints: /health

  deploy-production:
    needs: [build-docker, dast-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      packages: read
      contents: read
    env:
      IMAGE_REF: ${{ needs['build-docker'].outputs.image_ref }}
      COMPOSE_FILE: docker-compose.yml
      COMPOSE_SERVICE: app
      HEALTH_CHECK_URL: https://localhost:8080/health
      HEALTH_CHECK_MAX_RETRIES: "30"
      HEALTH_CHECK_DELAY: "10"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Login to GHCR
        if: ${{ startsWith(env.IMAGE_REF, 'ghcr.io/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Create local TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p certs
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout certs/key.pem \
            -out certs/cert.pem \
            -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
      - name: Pull latest image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE_REF"
      - name: Deploy via Docker Compose
        shell: bash
        run: |
          set -euo pipefail
          export IMAGE_REF
          docker compose -f "$COMPOSE_FILE" down || true
          docker compose -f "$COMPOSE_FILE" up -d "$COMPOSE_SERVICE"
      - name: Wait for health check
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 "$HEALTH_CHECK_MAX_RETRIES"); do
            echo "[${i}/${HEALTH_CHECK_MAX_RETRIES}] Checking health: ${HEALTH_CHECK_URL}"
            if curl -ksf "$HEALTH_CHECK_URL" >/dev/null 2>&1; then
              echo "✓ Health check passed"
              exit 0
            fi
            if [ "$i" -lt "$HEALTH_CHECK_MAX_RETRIES" ]; then
              echo "  Waiting ${HEALTH_CHECK_DELAY}s before retry..."
              sleep "$HEALTH_CHECK_DELAY"
            fi
          done

          echo "✗ Health check failed after $HEALTH_CHECK_MAX_RETRIES attempts" >&2
          docker compose -f "$COMPOSE_FILE" logs
          exit 1
