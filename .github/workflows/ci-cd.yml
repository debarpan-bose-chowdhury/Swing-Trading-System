name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Caps the permissions of every reusable-workflow job below.
permissions:
  contents: read
  packages: write
  deployments: write
  security-events: write


# Reusable workflows come from CI-CD. TEMPORARY: pinned to the CI-CD PR branch while that PR is validated;
# switch every `uses:` below to `@main` once the CI-CD PR is merged.
jobs:
  ci:
    name: CI (Python)
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/ci.yml@claude/loving-einstein-f191mp
    with:
      language: python
      python-install-command: pip install -e . pytest pytest-cov
      python-test-command: python -m pytest
      codeql-languages: python

  # Same-repo PRs also build/stage/scan (without moving :latest) so deployment problems surface before merge.
  build-docker:
    needs: ci
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/docker-build-push.yml@claude/loving-einstein-f191mp
    with:
      language: python
      dockerfile-path: Dockerfile
      image-name: swing-trading-system
      image-tag: ${{ github.sha }}
      tag-latest: ${{ github.event_name == 'push' }}
    secrets:
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}

  deploy-staging:
    needs: build-docker
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/deploy-staging.yml@claude/loving-einstein-f191mp
    with:
      image-name: swing-trading-system
      image-tag: ${{ github.sha }}
      compose-file: docker-compose.staging.yml
      health-check-url: https://localhost:8080/health
      tls-cert: true

  dast-scan:
    needs: deploy-staging
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/dast-smoke.yml@claude/loving-einstein-f191mp
    with:
      target-url: https://localhost:8080
      image-ref: ghcr.io/debarpan-bose-chowdhury/swing-trading-system:${{ github.sha }}
      compose-file: docker-compose.staging.yml
      tls-cert: true
      smoke-endpoints: /health

  deploy-production:
    needs: [build-docker, dast-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/deploy-production.yml@claude/loving-einstein-f191mp
    with:
      image-name: swing-trading-system
      image-tag: ${{ github.sha }}
      compose-file: docker-compose.yml
      health-check-url: https://localhost:8080/health
      tls-cert: true
