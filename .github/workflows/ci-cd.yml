name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  deployments: write
  packages: write
  pull-requests: read
  security-events: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
      - shell: bash
        run: python -m unittest discover -s tests -v

  build-docker:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/docker-build-push.yml@main
    with:
      language: python
      image-name: swing-trading-system
      image-tag: ${{ github.sha }}
      dockerfile-path: Dockerfile

  deploy-staging:
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/deploy-staging.yml@main
    with:
      image-ref: ${{ needs.build-docker.outputs.image-ref }}
      compose-file: docker-compose.staging.yml
      compose-service: app
      health-check-url: http://localhost:8080/health

  dast-scan:
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/dast-smoke.yml@main
    with:
      target-url: http://localhost:8080
      smoke-endpoints: /health

  deploy-production:
    needs: [build-docker, dast-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: debarpan-bose-chowdhury/CI-CD/.github/workflows/deploy-production.yml@main
    with:
      image-ref: ${{ needs.build-docker.outputs.image-ref }}
      compose-file: docker-compose.yml
      compose-service: app
      health-check-url: http://localhost:8080/health
