services:
  app:
    # The shared CI/CD deploy exports IMAGE_REF_SWING_TRADING_SYSTEM (multi-image pipeline);
    # IMAGE_REF is kept as a fallback for single-image use.
    image: ${IMAGE_REF_SWING_TRADING_SYSTEM:-${IMAGE_REF:-ghcr.io/debarpan-bose-chowdhury/swing-trading-system:latest}}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      TLS_CERTFILE: /certs/cert.pem
      TLS_KEYFILE: /certs/key.pem
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://localhost:8080/health', context=ssl._create_unverified_context())"]
      interval: 10s
      timeout: 5s
      retries: 3
